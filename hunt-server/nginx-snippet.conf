# Add inside the existing server block for mcp.arfhewallet.dev, which already
# terminates TLS. Keep the trailing slashes: they strip /hunt-api from the path
# the Node process sees, so it can keep serving /hunt/* as written.

location /hunt-api/ {
    proxy_pass http://127.0.0.1:8787/;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # The server checks this against ALLOWED_ORIGINS.
    proxy_set_header Origin            $http_origin;

    # Every request is a small JSON POST; anything larger is not one of ours.
    client_max_body_size 8k;

    # A chain lookup can take a few seconds on a cold RPC.
    proxy_read_timeout 30s;
}
